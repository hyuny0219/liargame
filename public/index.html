<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>🎭 라이어게임</title>
  <meta name="description" content="친구들과 온라인으로 즐기는 실시간 라이어게임">
  <meta name="theme-color" content="#6A5CFF">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="manifest" href="/manifest.json">
  <!-- 링크 공유 미리보기 (__ORIGIN__은 서버가 실제 주소로 치환) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="🎭 라이어게임">
  <meta property="og:description" content="접속코드만 있으면 바로 시작! 친구들과 온라인 라이어게임 한 판 어때요?">
  <meta property="og:image" content="__ORIGIN__/icons/og-image.png">
  <meta property="og:url" content="__ORIGIN__/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 떠다니는 배경 장식 -->
  <div id="bg-decor">
    <div class="bg-blob" style="width:300px;height:300px;left:-80px;top:-60px"></div>
    <div class="bg-blob" style="width:220px;height:220px;right:-60px;bottom:-40px;animation-delay:-3s"></div>
    <div class="bg-blob" style="width:140px;height:140px;right:18%;top:10%;animation-delay:-5s"></div>
    <div class="bg-shape" style="left:5%;top:66%">🎈</div>
    <div class="bg-shape" style="left:12%;top:14%;animation-delay:-2s">❓</div>
    <div class="bg-shape" style="right:7%;top:24%;animation-delay:-4s">🕵️</div>
    <div class="bg-shape" style="right:20%;bottom:10%;animation-delay:-1s">🎉</div>
    <div class="bg-confetti" style="left:10%;background:#FFC93C"></div>
    <div class="bg-confetti" style="left:26%;background:#3DDC97;animation-delay:-2s"></div>
    <div class="bg-confetti" style="left:48%;background:#FF5E7E;animation-delay:-4s"></div>
    <div class="bg-confetti" style="left:66%;background:#4D96FF;animation-delay:-1s"></div>
    <div class="bg-confetti" style="left:84%;background:#fff;animation-delay:-5s"></div>
  </div>

  <div id="toast"></div>
  <div id="confetti-layer"></div>

  <!-- 내 차례 알림 오버레이 -->
  <div id="turn-alert" class="hidden" aria-live="assertive">
    <div class="turn-alert-inner">
      <div class="turn-emoji">🗣️</div>
      <div class="turn-title">당신의 차례입니다!</div>
      <div class="turn-sub">제시어를 한 문장으로 설명해주세요</div>
    </div>
  </div>

  <!-- 단계 전환 오버레이 -->
  <div id="phase-overlay" class="hidden" aria-live="polite">
    <div class="po-emoji"></div>
    <div class="po-title"></div>
    <div class="po-sub"></div>
  </div>

  <!-- 로그인 화면 -->
  <section id="screen-login" class="screen center hidden">
    <div class="login-stage">
      <div class="logo-mask">🎭</div>
      <h1 class="big-title">라이어게임</h1>
      <div class="tagline">🎉 친구들과 함께하는 심리 파티게임!</div>
      <div class="card login-card">
        <label>🔑 접속코드</label>
        <input id="login-code" type="password" placeholder="비밀 접속코드를 입력하세요" autocomplete="off">
        <label>😎 닉네임</label>
        <input id="login-nick" type="text" maxlength="12" placeholder="닉네임 (최대 12자)" autocomplete="off">
        <button id="login-btn" class="btn3d block">🚀 입장하기!</button>
        <p id="login-error" class="error-text"></p>
      </div>
      <p class="sub">접속코드와 닉네임을 입력하고 입장하세요</p>
    </div>
  </section>

  <!-- 로비 화면 -->
  <section id="screen-lobby" class="screen hidden">
    <header class="topbar">
      <div class="top-logo">🎭 라이어게임</div>
      <div class="topbar-right">
        <span id="lobby-nick" class="nick-chip"></span>
        <button id="logout-btn" class="link-btn">로그아웃</button>
      </div>
    </header>

    <div class="lobby-sections">
      <div id="lobby-create" class="lobby-section">
        <div class="card panel">
          <h3>➕ 새로운 파티 열기</h3>
          <form id="create-form">
            <label>방 이름</label>
            <input id="create-name" type="text" maxlength="20" placeholder="방 이름 (비우면 자동)">
            <label>공개 설정</label>
            <div class="pill-row">
              <label class="pill-opt"><input type="radio" name="create-public" value="1" checked><span>🌐 공개방</span></label>
              <label class="pill-opt"><input type="radio" name="create-public" value="0"><span>🔒 비공개방</span></label>
            </div>
            <div class="settings-fields"></div>
            <button type="submit" class="btn3d mint block">🎉 방 만들기!</button>
          </form>
        </div>
      </div>

      <div id="lobby-find" class="lobby-section active">
        <div class="card panel" style="padding:16px">
          <div class="row">
            <input id="join-code" type="text" maxlength="6" placeholder="방 코드 6자리" style="text-transform:uppercase;letter-spacing:3px">
            <button id="join-code-btn" class="btn3d small blue">🔑 입장</button>
          </div>
        </div>
        <div class="card panel">
          <h3>🌐 지금 열려있는 파티</h3>
          <div id="room-list" class="room-list"></div>
        </div>
      </div>

      <div id="lobby-stats" class="lobby-section">
        <div class="card panel">
          <h3>📊 내 전적 <span style="float:right;transform:rotate(8deg)">🏆</span></h3>
          <div id="my-stats" class="stats-note"></div>
        </div>
      </div>
    </div>

    <nav class="tabbar" id="lobby-tabs">
      <button class="tab on" data-tab="lobby-find"><span class="ti">🔍</span>파티 찾기</button>
      <button class="tab" data-tab="lobby-create"><span class="ti">➕</span>파티 만들기</button>
      <button class="tab" data-tab="lobby-stats"><span class="ti">📊</span>내 전적</button>
    </nav>
  </section>

  <!-- 게임방 화면 -->
  <section id="screen-room" class="screen hidden">
    <header class="mtop">
      <button id="leave-btn" class="icon-btn" title="방 나가기">🚪</button>
      <div id="room-title" class="room-title"></div>
      <button id="room-code-chip" class="code-chip" title="클릭하여 초대 코드 복사"></button>
      <div class="grow"></div>
      <button id="players-btn" class="icon-btn" title="점수판">👥<span class="cnt" id="players-count"></span></button>
      <button id="mute-btn" class="icon-btn" title="효과음 켜기/끄기">🔊</button>
      <div id="timer-ring" class="timer-ring"><b id="phase-timer"></b></div>
    </header>

    <div class="room-grid">
      <div class="room-main">
        <div id="game-area"></div>
        <div class="card chat-panel">
          <div id="chat-log" class="chat-log"></div>
          <form id="chat-form" class="chat-form">
            <input id="chat-input" type="text" maxlength="200" placeholder="메시지 입력..." autocomplete="off">
            <button type="submit" class="btn3d small">🚀</button>
          </form>
        </div>
      </div>

      <aside id="players-drawer" class="drawer hidden">
        <div class="drawer-head">🏆 점수판
          <button id="drawer-close" class="icon-btn" title="닫기">✕</button>
        </div>
        <div id="players-panel"></div>
      </aside>
    </div>
    <div id="drawer-dim" class="drawer-dim hidden"></div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/lobby.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
